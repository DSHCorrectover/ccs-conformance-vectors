[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-conformance-checker"
version = "1.4.0"
description = "Independent conformance checker for CCS (Correctover Conformance Shape) receipts — zero CCS code imports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Guigui Wang", email = "wangguigui@correctover.com"}]
keywords = ["ccs", "conformance", "agent", "verification", "receipt", "ed25519", "jcs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cryptography>=41.0",
    "jcs>=0.2.0",
]

[project.scripts]
ccs-conformance-check = "ccs_conformance_checker:main"

[tool.setuptools]
py-modules = ["ccs_conformance_checker"]

[tool.setuptools.packages]
find = {include = ["checkers*"]}
